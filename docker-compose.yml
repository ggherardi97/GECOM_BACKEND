services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-15}
    container_name: ${POSTGRES_CONTAINER_NAME:-gecom_postgres}
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gecom_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gecom_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - gecom_network

  api:
    container_name: ${API_CONTAINER_NAME}
    build:
      context: .
      dockerfile: ${DOCKERFILE}
    ports:
      - "${API_PORT}:3000"
    volumes:
      - /node_modules
    env_file:
      - .env.dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@postgres:5432/${DB_NAME}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_EXPIRES_IN_REMEMBER: ${JWT_EXPIRES_IN_REMEMBER}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-super-secret-refresh-jwt-key}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_PREVIEW: ${MAIL_PREVIEW}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TO_TEST: ${EMAIL_TO_TEST}
      BREVO_SMTP_HOST: ${BREVO_SMTP_HOST}
      BREVO_SMTP_PORT: ${BREVO_SMTP_PORT}
      BREVO_SMTP_USER: ${BREVO_SMTP_USER}
      BREVO_SMTP_PASS: ${BREVO_SMTP_PASS}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      BILLING_TRIAL_DAYS: ${BILLING_TRIAL_DAYS}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY}
      BILLING_CUSTOM_REQUEST_EMAIL: ${BILLING_CUSTOM_REQUEST_EMAIL}
    command: >
      sh -c "npm install --no-audit --no-fund && npm run migration:up || true && npm run prisma:generate && npm run dev"
    networks:
      - gecom_network

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION:-latest}
    container_name: ${PGADMIN_CONTAINER_NAME:-pgadmin}
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 40
    depends_on:
      - postgres
    networks:
      - gecom_network

volumes:
  gecom_data:


networks:
  gecom_network:
    driver: bridge
